<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>YiPex 用户手册 3.1 — 本地预览</title>
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Roboto", sans-serif; background: #f8f9fa; color: rgba(0,0,0,.85); display: flex; }
  nav { width: 240px; background: #fff; border-right: 1px solid #e7e8e8; padding: 16px 0; height: 100vh; overflow-y: auto; position: sticky; top: 0; }
  nav .brand { font-weight: 700; font-size: 16px; padding: 0 20px 12px; color: #222; border-bottom: 1px solid #e7e8e8; margin-bottom: 8px; }
  nav a { display: block; padding: 7px 20px; color: rgba(0,0,0,.65); text-decoration: none; font-size: 14px; }
  nav a:hover { background: #f5f5f5; color: #222; }
  nav a.active { color: #222; font-weight: 600; background: #f5f5f5; border-right: 2px solid #222; }
  main { flex: 1; max-width: 780px; margin: 0 auto; padding: 40px 32px 80px; }
  h1 { font-size: 28px; margin: 8px 0 20px; }
  h2 { font-size: 22px; margin: 28px 0 12px; padding-bottom: 8px; border-bottom: 1px solid #e7e8e8; }
  h3 { font-size: 18px; margin: 24px 0 10px; }
  h4, h5 { font-size: 16px; margin: 20px 0 8px; }
  p { margin: 10px 0; line-height: 1.75; font-size: 15px; }
  img { max-width: 100%; border: 1px solid #e7e8e8; border-radius: 8px; margin: 12px 0; }
  .info { background: rgba(22,119,255,.06); border: 1px solid rgba(22,119,255,.3); border-radius: 8px; padding: 14px 16px; margin: 16px 0; font-size: 14px; line-height: 1.7; }
  .info::before { content: "💡"; margin-right: 6px; }
  strong { font-weight: 600; }
  ul { padding-left: 22px; margin: 8px 0; }
  li { margin: 4px 0; line-height: 1.7; font-size: 15px; }
  a { color: #1677ff; }
</style>
</head>
<body>
<nav><div class="brand">YiPex 手册 3.1</div><div id="menu"></div></nav>
<main><div id="content">加载中…</div></main>
<script>
const pages = [
  ['总览','index.mdx'],['注册','pc-duan/zhu-ce.mdx'],['登录','pc-duan/deng-lu.mdx'],['认证','pc-duan/ren-zheng.mdx'],
  ['收款','pc-duan/shou-kuan.mdx'],['充值','pc-duan/chong-zhi.mdx'],['转入法币钱包','pc-duan/zhuan-ru-fa-bi-qian-bao.mdx'],
  ['付款','pc-duan/fu-kuan.mdx'],['换汇','pc-duan/huan-hui.mdx'],['数币快捷出金','pc-duan/shu-bi-kuai-jie-chu-jin.mdx'],
  ['贸易背景材料','pc-duan/mao-yi-bei-jing-cai-liao.mdx'],['数币钱包流水','pc-duan/shu-bi-qian-bao-liu-shui.mdx'],
  ['法币钱包流水','pc-duan/fa-bi-qian-bao-liu-shui.mdx'],['收款账户','pc-duan/shou-kuan-zhang-hu.mdx'],
  ['个人中心','pc-duan/ge-ren-zhong-xin.mdx'],['区块链地址校验','pc-duan/qu-kuai-lian-di-zhi-jiao-yan.mdx'],
];
const menu = document.getElementById('menu');
pages.forEach(([name, file], i) => {
  const a = document.createElement('a');
  a.textContent = name; a.href = '#' + i;
  a.onclick = e => { e.preventDefault(); load(i); };
  menu.appendChild(a);
});
const md = window.markdownit({ html: false, breaks: false });
function render(src) {
  let t = src.replace(/^---[\s\S]*?---\s*/, '');
  const title = (src.match(/^title: "(.*)"/m) || [])[1] || '';
  // <Info> 块 → callout
  t = t.replace(/<Info>([\s\S]*?)<\/Info>/g, (_, c) =>
    '\n<callout>' + md.render(c.trim().replace(/^\*\*|\*\*$/g,'')) + '</callout>\n');
  let html = title ? `<h1>${title}</h1>` + md.render(t) : md.render(t);
  return html.replace(/<callout>/g,'<div class="info">').replace(/<\/callout>/g,'</div>');
}
async function load(i) {
  const [name, file] = pages[i];
  document.querySelectorAll('#menu a').forEach((a, j) => a.classList.toggle('active', j === i));
  const res = await fetch(file);
  document.getElementById('content').innerHTML = render(await res.text());
  window.scrollTo(0, 0);
}
load(location.hash ? +location.hash.slice(1) : 0);
</script>
</body>
</html>
